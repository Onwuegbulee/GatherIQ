# Render Blueprint Specification for GatherIQ (100% Free Tier Configuration)
# Backend: Render Free Web Service (Python 3.12, 512 MB RAM)
# Database: Neon Free PostgreSQL (External, zero Render database billing)
# Frontend: Vercel (External)
# Learn more: https://render.com/docs/blueprint-spec

version: "1"

services:
  - type: web
    name: gatheriq-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: ALLOW_DEMO_COUNTS
        value: "false"
      - key: SUPER_ADMIN_EMAIL
        value: superadmin@gatheriq.dev
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_NAME
        value: Platform Super Admin
